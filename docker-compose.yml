services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: backend
    restart: unless-stopped
    # ENV_FILE i APP_PORT: test E2E (scripts/e2e_compose.py) podaje własny plik bez klucza API.
    env_file: ${ENV_FILE:-.env}
    volumes:
      # wzorce klauzul dla seeda (app/repo/seed.py: DEFAULT_TEMPLATES_PATH → /data/wzorce w obrazie)
      - ./data/wzorce:/data/wzorce:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # obraz python:slim nie ma curl; start_period obejmuje migracje przed startem uvicorn
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # bez ports: backend jest dostępny tylko przez nginx (CSP, limit logowania, limit rozmiaru)

  frontend:
    build: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
