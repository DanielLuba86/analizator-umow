# Limit prób logowania per IP (backend za proxy widzi tylko IP nginx, więc limit jest tutaj).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# Produkcja z reverse proxy TLS przed tym nginx: bez poniższych linii $binary_remote_addr to
# adres proxy i wszyscy użytkownicy dzielą jeden limit logowania. Odkomentuj, wpisz sieć proxy
# i upewnij się, że proxy ustawia X-Forwarded-For.
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Umowa ma najwyżej 200 000 znaków (max_contract_chars); 1 MB mieści ją z zapasem na UTF-8 i JSON.
    client_max_body_size 1m;

    # Adres backendu w zmiennej: nginx rozwiązuje nazwę przy każdym żądaniu (DNS Dockera,
    # ważność 10 s), a nie raz przy starcie. Dzięki temu startuje przed backendem i nie zwraca
    # 502 po odtworzeniu kontenera backendu z nowym adresem IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        # $http_host zachowuje port, więc backend może porównać nagłówek Origin z Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
